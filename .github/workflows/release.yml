# 공개 저장소(chalkieboard-icloud-mcp)용 — 태그 v* 를 밀면: 자가 검사 → 번들 → GitHub 릴리스에 첨부 → server.json 해시 → 공개 MCP 레지스트리 발행.
# 레지스트리 인증은 GitHub OIDC(id-token) — 비밀 키가 필요 없다. 이름 공간 io.github.<저장소 소유자>/* 는 소유자 토큰으로 자동 검증된다.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: 자가 검사
        run: node selftest.mjs
      - name: 번들
        run: ./make_bundle.sh
      - name: 릴리스에 첨부
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          sha=$(openssl dgst -sha256 dist/chalkieboard.mcpb | awk '{print $2}')
          gh release create "${GITHUB_REF_NAME}" dist/chalkieboard.mcpb --title "Chalkieboard iCloud MCP ${GITHUB_REF_NAME#v}" --notes "chalkieboard.mcpb sha256 $sha" || gh release upload "${GITHUB_REF_NAME}" dist/chalkieboard.mcpb --clobber
          python3 - "$sha" <<'EOF'
          import json,sys,os
          sha=sys.argv[1]; repo=os.environ["GITHUB_REPOSITORY"]; tag=os.environ["GITHUB_REF_NAME"]
          j=json.load(open("server.json"))
          j["version"]=tag.lstrip("v")
          j["packages"][0]["identifier"]=f"https://github.com/{repo}/releases/download/{tag}/chalkieboard.mcpb"
          j["packages"][0]["fileSha256"]=sha
          json.dump(j,open("server.json","w"),ensure_ascii=False,indent=2)
          EOF
      - name: 레지스트리 발행
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
